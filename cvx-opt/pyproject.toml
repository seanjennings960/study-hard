[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvx-opt"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Sean Jennings", email = "sean.jennings1@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "notebook",
  "jupyterlab-vim",
  "cvxpy",
  "pandas",
  "numpy",
  "matplotlib",
]

[project.urls]
Documentation = "https://github.com/Sean Jennings/cvx-opt#readme"
Issues = "https://github.com/Sean Jennings/cvx-opt/issues"
Source = "https://github.com/Sean Jennings/cvx-opt"

[tool.hatch.version]
path = "src/cvx_opt/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/cvx_opt tests}"

[tool.coverage.run]
source_pkgs = ["cvx_opt", "tests"]
branch = true
parallel = true
omit = [
  "src/cvx_opt/__about__.py",
]

[tool.coverage.paths]
cvx_opt = ["src/cvx_opt", "*/cvx-opt/src/cvx_opt"]
tests = ["tests", "*/cvx-opt/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
